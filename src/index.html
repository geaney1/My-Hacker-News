<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HackerNews</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // The theme chosen in the profile (or the one the device prefers) is set before the page is
      // painted, so a dark page does not flash white first. See ThemeStore.
      (function () {
        try {
          var theme = localStorage.getItem('hacker-news.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          // Storage is blocked: the light theme stays.
        }
      })();
    </script>
    <script>
      // The page is shown before the app has loaded, and until then the browser would send a form
      // itself: the page would reload and start loading again. The app sends every form, so the
      // browser is never to. The forms also say method="post", which keeps what was typed out of
      // the address when this script cannot run.
      document.addEventListener(
        'submit',
        function (event) {
          event.preventDefault();
          // Until the app has taken over the page (Angular then removes "ngh"), the submission
          // goes no further. Angular would otherwise record it and send it again once loaded,
          // which fails: a replayed event cannot be cancelled, and the form tries to.
          if (document.querySelector('app-root[ngh]')) {
            event.stopPropagation();
          }
        },
        true,
      );
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
