<button
  type="button"
  class="info-button"
  [attr.aria-label]="'About ' + label()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="tipId()"
  (click)="toggle()"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="9" />
    <path d="M12 11v5" />
    <circle cx="12" cy="7.75" r="0.6" fill="currentColor" />
  </svg>
</button>
<p class="info-text" [id]="tipId()" [hidden]="!open()">
  @for (part of parts(); track $index) {
    @if (part.isName) {
      <strong class="setting-name">{{ part.text }}</strong>
    } @else {
      <ng-container>{{ part.text }}</ng-container>
    }
  }
</p>
