<div class="field">
  <label [for]="fieldId()">{{ label() }}</label>
  <input
    [id]="fieldId()"
    [type]="type()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-describedby]="describedBy()"
    [formField]="field()"
  />
  @if (hint()) {
    <p class="hint" [id]="hintId()">{{ hint() }}</p>
  }
  @if (errorMessage()) {
    <p class="error" [id]="errorId()" role="alert">{{ errorMessage() }}</p>
  }
</div>
