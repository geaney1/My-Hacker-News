<div class="banner" [attr.role]="role()" [attr.aria-labelledby]="heading() ? headingId : null">
  @switch (kind()) {
    @case ('error') {
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7.5v5.5" />
        <circle cx="12" cy="16.5" r="0.6" fill="currentColor" />
      </svg>
    }
    @case ('info') {
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5" />
        <circle cx="12" cy="7.75" r="0.6" fill="currentColor" />
      </svg>
    }
    @default {
      <!-- A clock, for a warning about time. -->
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </svg>
    }
  }

  <div class="message">
    @if (heading(); as title) {
      <h2 class="heading" [id]="headingId">{{ title }}</h2>
    }
    <div class="text"><ng-content /></div>
  </div>

  <div class="action"><ng-content select="[bannerAction]" /></div>
</div>
