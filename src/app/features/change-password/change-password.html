<app-auth-card heading="Change password" closeLink="/user-profile">
  <form class="auth-form" method="post" [formRoot]="changePasswordForm">
    <app-form-text-field
      fieldId="current-password"
      label="Current password"
      autocomplete="current-password"
      [type]="showPassword() ? 'text' : 'password'"
      [field]="changePasswordForm.currentPassword"
    />

    <app-form-text-field
      fieldId="new-password"
      label="New password"
      autocomplete="new-password"
      [type]="showPassword() ? 'text' : 'password'"
      [field]="changePasswordForm.newPassword"
    />

    <app-form-text-field
      fieldId="confirm-new-password"
      label="Verify new password"
      autocomplete="new-password"
      [type]="showPassword() ? 'text' : 'password'"
      [field]="changePasswordForm.confirmNewPassword"
    />

    <label class="show-password">
      <input type="checkbox" [checked]="showPassword()" (change)="toggleShowPassword()" />
      Show passwords
    </label>

    @if (formError(); as message) {
      <app-banner class="form-error" kind="error" [compact]="true">{{ message }}</app-banner>
    }

    <button type="submit" class="button button-solid">Change password</button>
  </form>
</app-auth-card>
