<app-auth-card heading="Log in">
  <form class="auth-form" method="post" [formRoot]="logInForm">
    <app-form-text-field
      fieldId="username"
      label="Username"
      autocomplete="username"
      [field]="logInForm.username"
    />

    <app-form-text-field
      fieldId="password"
      label="Password"
      autocomplete="current-password"
      [type]="showPassword() ? 'text' : 'password'"
      [field]="logInForm.password"
    />

    <label class="show-password">
      <input type="checkbox" [checked]="showPassword()" (change)="toggleShowPassword()" />
      Show password
    </label>

    @if (formError(); as message) {
      <app-banner class="form-error" kind="error" [compact]="true">{{ message }}</app-banner>
    }

    <button type="submit" class="button button-solid">Log in</button>
  </form>

  <p class="alternative">
    New here?
    <a routerLink="/create-user" [queryParams]="{ returnUrl: returnUrl() }">Create a new user</a>
  </p>
</app-auth-card>
